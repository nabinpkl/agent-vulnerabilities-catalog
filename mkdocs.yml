site_name: Agent Vulnerabilities Catalog
site_description: 96 Agent vulnerabilities ranked from fundamentals to frontier
repo_url: https://github.com/nabinpkl/agent-vulnerabilities-catalog
repo_name: nabinpkl/agent-vulnerabilities-catalog

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.integrate
    - toc.follow

nav:
  - Home: index.md

markdown_extensions:
  - toc:
      permalink: true
      toc_depth: 3
